[project]
name = "camunda-orchestration-sdk"
version = "10.1.0-dev.26"
description = "Python client for Camunda 8 Orchestration Cluster API"
readme = "README.md"
authors = [
    { name = "Josh Wulf", email = "josh.wulf@camunda.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "attrs>=21.3.0",
    "pydantic>=2",
    "python-dateutil>=2.8.2",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.10"
extra-paths = ["generated"]

[tool.ty.src]
include = ["runtime", "hooks", "tests", "examples", "generated", "stubs"]
exclude = [
    "scripts",
    ".venv",
    "**/__pycache__",
    "**/node_modules",
    "external-spec",
]

[tool.ty.rules]
# Maximum strictness: every ty rule is treated as an error. The 93 rules that already
# default to "error" need no entry here; the block below escalates the 21 "warn"-default
# and 5 "ignore"-default rules to "error" so no type-safety signal is silently downgraded.
# Verified green against the current tree with `ty check --error all`. If a future change
# cannot satisfy one of these, downgrade that single rule here with an inline justification
# rather than relaxing the whole set.

# Escalated from the "warn" default level.
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
invalid-named-tuple-override = "error"
mismatched-type-name = "error"
possibly-missing-implicit-call = "error"
possibly-missing-submodule = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
subclass-of-dataclass-with-order = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsupported-base = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"

# Escalated from the "ignore" (disabled) default level.
division-by-zero = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"

[tool.ruff]
extend-exclude = [
    "generated",
    "stubs",
]

[tool.ruff.lint]
# Ruff's default rules (E4/E7/E9, F) plus additional families:
#   B      flake8-bugbear   — likely bugs (loop-variable capture, missing zip strict, …)
#   RUF    Ruff-specific    — mutable defaults, unsorted __all__, unused noqa, …
#   ASYNC  flake8-async     — blocking calls inside async functions
#   S      flake8-bandit    — security scanning of production code paths
extend-select = ["B", "RUF", "ASYNC", "S"]
ignore = [
    # Ambiguous-unicode checks fire on intentional typographic characters (em dashes,
    # arrows, non-breaking spaces) in strings/docstrings/comments. Rewriting them adds no
    # value and hurts readability.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Generated code is excluded from normal lint via `extend-exclude`, but the generation step
# runs `ruff check generated/ --fix` with an explicit path (which bypasses excludes) to clean
# up imports and formatting. The expanded families (B/RUF/ASYNC/S) are meaningless on
# machine-generated output and largely non-fixable, so scope that pass down to the base rules.
"generated/**" = ["B", "RUF", "ASYNC", "S"]
"stubs/**" = ["B", "RUF", "ASYNC", "S"]
# Bandit (S) targets production code paths handling untrusted input. Asserts (S101) are the
# idiomatic test assertion, and any hardcoded credentials / subprocess usage in the suite are
# test fixtures, not security-relevant.
"tests/**" = ["S"]
# Examples deliberately show fake credentials for illustration.
"examples/**" = ["S"]
# Build/generation tooling runs locally against developer-controlled, trusted inputs (the git
# checkout, the bundled spec). Its subprocess calls (git/uv/npx), md5 cache keys, asserts, and
# SQL-like strings embedded in generated-code templates are intentional and not attack surface.
"generate.py" = ["S"]
"bundle.py" = ["S"]
"hooks/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
# Treat warnings as errors so that deprecations and resource-leak warnings surface as test
# failures instead of being silently ignored.
filterwarnings = [
    "error",
    # Unraisable exceptions (e.g. ResourceWarning from an event loop or socket collected during
    # GC) are surfaced non-deterministically by the interpreter, not emitted synchronously by the
    # code under test, so they cannot be reliably asserted on and are treated as noise here.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "generated"

[tool.setuptools.packages.find]
where = ["generated"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=1.3.0",
    "pyyaml>=6.0",
    "openapi-python-client>=0.21.0",
    "jsonref>=1.1.0",
    "psutil>=5.9.0",
    "pydantic-settings>=2.12.0",
    "sphinx>=8.0.0",
    "sphinx-markdown-builder>=0.6.0",
    "sphinx-book-theme>=1.1.0",
    "ty>=0.0.40",
]
ci = [
    "python-semantic-release>=9.15.0",
]
itest = [
    "fastapi>=0.135.3",
    "uvicorn>=0.40.0",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"
upload_to_pypi = false
upload_to_release = true
tag_format = "v{version}"

# Branch configuration
# - main: alpha prereleases (dev pre-releases on PyPI)
# - stable/<major>: stable releases
# SDK major tracks Camunda server minor (server 8.9 → SDK 9.x).
[tool.semantic_release.branches.main]
match = "main"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.branches."stable/*"]
match = "^stable/.*$"
prerelease = false

# Standard semantic versioning:
# Patch: fix, perf, revert
# Minor: feat
# Major: BREAKING CHANGE footer
[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test",
    "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "revert"]
