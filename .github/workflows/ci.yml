name: CI

on:
  push:
    branches-ignore:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "Git ref/branch/tag/SHA in camunda/camunda.git to fetch the OpenAPI spec from (temporary override)."
        required: false
        default: ""

jobs:
  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}
      default-ref: 'stable/8.9'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  test:
    needs: spec-ref-guard
    runs-on: ubuntu-latest
    env:
      # Default is stable/8.9 for this branch (pinned to Camunda 8.9 spec).
      # Temporary override options:
      # - Repo variable: SPEC_REF_OVERRIDE
      # - Manual run: workflow_dispatch input spec_ref
      SPEC_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --group itest

      # TODO: Restore binary download when camunda-schema-bundler repo is public.
      # - name: Download camunda-schema-bundler
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     gh release download --repo camunda/camunda-schema-bundler --pattern 'camunda-schema-bundler-linux-x64' --dir /tmp/bundler
      #     chmod +x /tmp/bundler/camunda-schema-bundler-linux-x64
      #     echo "BUNDLER_BIN=/tmp/bundler/camunda-schema-bundler-linux-x64" >> "$GITHUB_ENV"

      - name: Set up Node.js (for npx camunda-schema-bundler)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Start Docker Compose
        run: docker compose -f docker/docker-compose.yaml up -d --wait

      - name: Run tests (Unit and Integration)
        run: make itest

      - name: Check SDK Example Coverage
        if: matrix.python-version == '3.12'
        run: python scripts/check_example_coverage.py

      - name: Check Method Example Completeness
        if: matrix.python-version == '3.12'
        run: python scripts/check_method_example_completeness.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # If the following task fails, run make config-reference to update the config reference in README and push the changes
      - name: Check config reference is up-to-date
        run: make config-reference-check

      # If the following task fails, run make sync-readme to update README snippets and push the changes
      - name: Check README snippets are up-to-date
        run: make sync-readme-check

      - name: Run linter
        run: make lint

      - name: Check docs links
        run: make docs-link-check

      - name: Run type checker
        run: make typecheck
