name: CI

on:
  push:
    branches-ignore:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "Git ref/branch/tag/SHA in camunda/camunda.git to fetch the OpenAPI spec from (temporary override)."
        required: false
        default: ""

jobs:
  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}
      default-ref: 'stable/8.9'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  # The generator needs Python >= 3.11, but the SDK supports 3.10: generate once here, on
  # the pinned interpreter, and test that output on every matrix leg (#384).
  generate:
    needs: spec-ref-guard
    runs-on: ubuntu-latest
    env:
      SPEC_REF: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.9' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No UV_PYTHON here: uv uses .python-version, which must stay >= 3.11 for the generator.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up Node.js (for npx camunda-schema-bundler)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate SDK
        run: make generate SPEC_REF="${SPEC_REF}"

      - name: Upload generated SDK
        uses: actions/upload-artifact@v7
        with:
          name: generated-sdk
          path: generated/
          if-no-files-found: error

  test:
    needs: generate
    runs-on: ubuntu-latest
    env:
      # Make every uv command in this leg use the matrix interpreter. Without this, uv
      # follows .python-version (3.11) and every leg silently tests on 3.11 (#384).
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --group itest

      # Guard against #384 regressing: fail if this leg is not running the interpreter it
      # is named after.
      - name: Verify interpreter matches matrix
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          uv run python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; print('Python', sys.version); sys.exit(0 if v == os.environ['EXPECTED'] else 'leg runs Python %s, expected %s' % (v, os.environ['EXPECTED']))"

      # Replace, not overlay: the checkout carries the committed output, and files that this
      # generation no longer produces must not linger.
      - name: Clear committed generated SDK
        run: rm -rf generated

      - name: Download generated SDK
        uses: actions/download-artifact@v8
        with:
          name: generated-sdk
          path: generated/

      - name: Run unit tests (acceptance)
        run: make test

      - name: Start Docker Compose
        run: docker compose -f docker/docker-compose.yaml up -d --wait

      - name: Run integration tests
        run: make itest-only

      - name: Check SDK Example Coverage
        if: matrix.python-version == '3.12'
        run: python scripts/check_example_coverage.py

      - name: Check Method Example Completeness
        if: matrix.python-version == '3.12'
        run: python scripts/check_method_example_completeness.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # If the following task fails, run make config-reference to update the config reference in README and push the changes
      - name: Check config reference is up-to-date
        run: make config-reference-check

      # If the following task fails, run make sync-readme to update README snippets and push the changes
      - name: Check README snippets are up-to-date
        run: make sync-readme-check

      - name: Run linter
        run: make lint

      - name: Check docs links
        run: make docs-link-check

      - name: Run type checker
        run: make typecheck
