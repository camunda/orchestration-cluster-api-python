name: CI

on:
  push:
    branches-ignore:
      - main
      - 'stable/**'
  pull_request:
    branches:
      - main
      - 'stable/**'
  schedule:
    # Nightly full integration matrix (all supported Python versions).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "Git ref/branch/tag/SHA in camunda/camunda.git to fetch the OpenAPI spec from (temporary override)."
        required: false
        default: ""

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-commitlint.yml@v1

  breaking-change-guard:
    if: github.event_name == 'pull_request'
    uses: camunda/sdk-infra/.github/workflows/sdk-breaking-change-guard.yml@v1

  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}
      default-ref: 'main'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  bundle-spec:
    needs: spec-ref-guard
    uses: camunda/sdk-infra/.github/workflows/sdk-bundle-spec.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}

  # Generate once, then test the same output on every Python version. The generator
  # (openapi-python-client) needs Python >= 3.11 while the SDK supports 3.10, so the 3.10 leg
  # cannot generate for itself -- and every leg should test identical bytes anyway (#384).
  generate:
    needs: bundle-spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No UV_PYTHON here: uv uses .python-version, which must stay >= 3.11 for the generator.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate SDK
        run: make generate-only

      - name: Upload generated SDK
        uses: actions/upload-artifact@v7
        with:
          name: generated-sdk
          path: |
            generated/
            stubs/
          if-no-files-found: error

  test:
    needs: [bundle-spec, generate]
    runs-on: ubuntu-latest
    # Backstop only; the integration steps below carry their own tighter timeouts. Without
    # this the job inherits GitHub's 6h default.
    timeout-minutes: 25
    env:
      # Make every uv command in this leg use the matrix interpreter. Without this, uv
      # follows .python-version (3.14) and every leg silently tests on 3.14 (#384).
      UV_PYTHON: ${{ matrix.python-version }}
      # The full integration matrix (all Python versions) runs nightly and on manual
      # dispatch. On PRs and branch pushes, integration runs only on the pinned version
      # (3.12) to save CI time, while unit/acceptance tests still run on every version.
      FULL_MATRIX: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      # The snapshot is the server half of the same upstream point the spec above is
      # bundled from. Pinning one without the other puts the client and the server on
      # opposite sides of a rename, which surfaces as an await-completion timeout
      # rather than as drift -- so if this stops tracking, SPEC_REF must stop too.
      #
      # This narrows the skew window rather than closing it: the snapshot is rebuilt
      # periodically, so a bundle taken just after an upstream merge can outrun the
      # published image by a few hours. That failure is self-clearing on the next
      # build, and it names upstream rather than the PR.
      #
      # A SPEC_REF override has no matching published image when it names a branch,
      # so it keeps the snapshot and accepts the skew -- which is what the override's
      # required ack/expiry is for. Set CAMUNDA_IMAGE_OVERRIDE alongside the spec
      # override when testing a ref that does have one (a release tag).
      CAMUNDA_DOCKER_IMAGE_VERSION: ${{ vars.CAMUNDA_IMAGE_OVERRIDE || '8.11-SNAPSHOT' }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --group itest

      # Guard against #384 regressing: fail if this leg is not running the interpreter it
      # is named after.
      - name: Verify interpreter matches matrix
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          uv run python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; print('Python', sys.version); sys.exit(0 if v == os.environ['EXPECTED'] else 'leg runs Python %s, expected %s' % (v, os.environ['EXPECTED']))"

      # Replace, not overlay: the checkout carries the committed output, and files that this
      # generation no longer produces must not linger (make generate-only starts clean too).
      - name: Clear committed generated SDK
        run: rm -rf generated stubs

      - name: Download generated SDK
        uses: actions/download-artifact@v8
        with:
          name: generated-sdk
          path: .

      - name: Run unit tests (acceptance)
        run: make test

      - name: Start Integration Stack
        if: matrix.python-version == '3.12' || env.FULL_MATRIX == 'true'
        timeout-minutes: 10
        uses: camunda/sdk-infra/actions/start-camunda@v1
        with:
          docker-dir: docker

      # Step-level timeouts rather than relying on the job backstop: a step timeout still
      # lets "Stop Integration Stack" run and upload the Docker logs artifact, which is
      # what a hang needs to be diagnosed from.
      - name: Run integration tests
        if: matrix.python-version == '3.12' || env.FULL_MATRIX == 'true'
        timeout-minutes: 15
        run: make itest-only

      - name: Stop Integration Stack
        if: always() && (matrix.python-version == '3.12' || env.FULL_MATRIX == 'true')
        uses: camunda/sdk-infra/actions/stop-camunda@v1
        with:
          docker-dir: docker
          artifact-name: integration-docker-logs-py${{ matrix.python-version }}

      - name: Run type checker
        if: matrix.python-version == '3.12'
        run: make typecheck

      - name: Check SDK Example Coverage
        if: matrix.python-version == '3.12'
        run: python scripts/check_example_coverage.py

      - name: Check Method Example Completeness
        if: matrix.python-version == '3.12'
        run: python scripts/check_method_example_completeness.py

  # Build the wheel from this change's generated SDK and install it as a user would: clean
  # venv, runtime dependencies only, on the wheel's own Requires-Python floor and the newest
  # pinned Python. The same gate runs before publishing; running it here catches a broken
  # package before merge rather than at release time (#389).
  smoke-wheel:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Clear committed generated SDK
        run: rm -rf generated stubs

      - name: Download generated SDK
        uses: actions/download-artifact@v8
        with:
          name: generated-sdk
          path: .

      - name: Build and smoke test wheel
        run: make smoke-wheel

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # If the following task fails, run make config-reference to update the config reference in README and push the changes
      - name: Check config reference is up-to-date
        run: make config-reference-check

      # If the following task fails, run make sync-readme to update README snippets and push the changes
      - name: Check README snippets are up-to-date
        run: make sync-readme-check

      - name: Run linter
        run: make lint

      # If the following task fails, remove the new escape hatch or justify it and run
      # `make escape-hatch-update` to raise the baseline.
      - name: Check for new type-safety escape hatches
        run: make escape-hatch-check

      - name: Check docs links
        run: make docs-link-check
