name: Publish

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: "Git ref/branch/tag/SHA in camunda/camunda.git to fetch the OpenAPI spec from (temporary override)."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}
      default-ref: 'main'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  bundle-spec:
    needs: spec-ref-guard
    uses: camunda/sdk-infra/.github/workflows/sdk-bundle-spec.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}

  # Generate once, then test the same output on every Python version. The generator needs
  # Python >= 3.11 while the SDK supports 3.10, so the 3.10 leg cannot generate for itself
  # (#384). The `generate` job below regenerates from the same spec to commit the result.
  build-sdk:
    needs: bundle-spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # No UV_PYTHON here: uv uses .python-version, which must stay >= 3.11 for the generator.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate SDK
        run: make generate-only

      - name: Upload generated SDK
        uses: actions/upload-artifact@v7
        with:
          name: generated-sdk
          path: |
            generated/
            stubs/
          if-no-files-found: error

  test:
    needs: [bundle-spec, build-sdk]
    runs-on: ubuntu-latest
    # Backstop only; the integration steps below carry their own tighter timeouts. Without
    # this the job inherits GitHub's 6h default, and because this workflow serialises on
    # `release-<ref>` with cancel-in-progress: false, one hung job blocks every later
    # release for those 6h.
    timeout-minutes: 25
    env:
      # Make every uv command in this leg use the matrix interpreter. Without this, uv
      # follows .python-version and every leg silently tests on the same Python (#384).
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev --group itest

      # Guard against #384 regressing: fail if this leg is not running the interpreter it
      # is named after.
      - name: Verify interpreter matches matrix
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          uv run python -c "import os, sys; v = '%d.%d' % sys.version_info[:2]; print('Python', sys.version); sys.exit(0 if v == os.environ['EXPECTED'] else 'leg runs Python %s, expected %s' % (v, os.environ['EXPECTED']))"

      # Replace, not overlay: files this generation no longer produces must not linger.
      - name: Clear committed generated SDK
        run: rm -rf generated stubs

      - name: Download generated SDK
        uses: actions/download-artifact@v8
        with:
          name: generated-sdk
          path: .

      - name: Run unit tests (acceptance)
        run: make test

      - name: Start Integration Stack
        timeout-minutes: 10
        uses: camunda/sdk-infra/actions/start-camunda@v1
        with:
          docker-dir: docker

      # Step-level timeouts rather than relying on the job backstop: a step timeout still
      # lets "Stop Integration Stack" run and upload the Docker logs artifact, which is
      # what a hang needs to be diagnosed from.
      - name: Run integration tests
        timeout-minutes: 15
        run: make itest-only

      - name: Stop Integration Stack
        if: always()
        uses: camunda/sdk-infra/actions/stop-camunda@v1
        with:
          docker-dir: docker
          artifact-name: publish-docker-logs-py${{ matrix.python-version }}

  generate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      has_changes: ${{ steps.check_changes.outputs.has_changes }}
    steps:
      # This job pushes directly to a ruleset-protected branch. GITHUB_TOKEN can never
      # bypass a ruleset (the GitHub Actions app is not an eligible bypass actor), so the
      # push is made as camunda-sdk-automation, which is registered as one.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate SDK
        run: make generate-local

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated changes
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(generation): update generated SDK [skip ci]"
          # Rebase + push, retrying if another commit lands on the branch meanwhile.
          bash scripts/push-with-rebase-retry.sh

  release:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    environment: pypi
    steps:
      # semantic-release commits and pushes to a ruleset-protected branch; GITHUB_TOKEN
      # cannot bypass a ruleset, so it runs as camunda-sdk-automation instead.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev --group ci

      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Check if release needed (dry run)
        id: check_release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OUTPUT=$(uv run semantic-release version --print 2>&1) || true
          if echo "$OUTPUT" | grep -q "No release will be made"; then
            echo "release_needed=false" >> $GITHUB_OUTPUT
          else
            echo "release_needed=true" >> $GITHUB_OUTPUT
            NEW_VERSION=$(uv run semantic-release version --print 2>/dev/null | tail -1)
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Validate version matches stable branch
        if: steps.check_release.outputs.release_needed == 'true' && startsWith(github.ref_name, 'stable/')
        env:
          BRANCH: ${{ github.ref_name }}
          NEW_VERSION: ${{ steps.check_release.outputs.new_version }}
        run: |
          # Same check scripts/semantic-release-with-retry.sh repeats before every release
          # attempt, since the version can change if a retry picks up new commits.
          bash scripts/check-stable-branch-version.sh "$BRANCH" "$NEW_VERSION"

      # Release gate (#389): install the wheel exactly as a user would -- clean venv, runtime
      # dependencies only, on the package's own Requires-Python floor and the newest pinned
      # Python -- and import every module, construct the clients and decode a gateway
      # timestamp. Runs BEFORE semantic-release tags anything, so a failure leaves no tag,
      # no GitHub release and nothing on PyPI. Built outside dist/ so it is never uploaded.
      - name: Smoke test release candidate
        if: steps.check_release.outputs.release_needed == 'true'
        run: |
          uv build --quiet --wheel --out-dir "$RUNNER_TEMP/candidate"
          # setuptools never prunes build/; don't let the candidate's staging leak into the
          # wheel built for upload below.
          rm -rf build
          bash scripts/smoke-test-wheel.sh "$RUNNER_TEMP"/candidate/*.whl

      - name: Create release
        if: steps.check_release.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Retries in place if the release commit's push loses a race with a concurrent
          # merge to the branch (see the script for why this is safe).
          bash scripts/semantic-release-with-retry.sh
          uv run semantic-release publish

      - name: Build package
        if: steps.check_release.outputs.release_needed == 'true'
        run: uv build

      # Re-check the exact files being uploaded: the release commit (version stamp) or a
      # retry that picked up new commits can change them after the candidate check. A
      # failure here leaves the tag without a PyPI upload, which is recoverable; a broken
      # upload is not (PyPI never accepts the same version twice).
      - name: Smoke test built package
        if: steps.check_release.outputs.release_needed == 'true'
        run: bash scripts/smoke-test-wheel.sh dist/*.whl

      - name: Publish to PyPI
        if: steps.check_release.outputs.release_needed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Summary
        run: |
          if [[ "${{ steps.check_release.outputs.release_needed }}" == "true" ]]; then
            echo "### Release Published :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** ${{ steps.check_release.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.ref_name }}" == "main" ]]; then
              echo "**Type:** Dev pre-release" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Install with: \`pip install camunda-orchestration-sdk --pre\`" >> $GITHUB_STEP_SUMMARY
            else
              STABLE_MAJOR=$(echo "${{ github.ref_name }}" | sed 's|stable/||')
              echo "**Type:** Stable release" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Install with: \`pip install \"camunda-orchestration-sdk>=${STABLE_MAJOR}.0.0,<$((STABLE_MAJOR+1)).0.0\"\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No commits requiring a release were found." >> $GITHUB_STEP_SUMMARY
          fi

  notify-release-failure:
    needs: [spec-ref-guard, bundle-spec, build-sdk, test, generate, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1
    with:
      repo-name: orchestration-cluster-api-python
      workflow-name: Publish
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
