# Resolves the auto-filed "Missing example coverage" issues (label `new-operations`)
# by running the Copilot CLI in CI and opening a pull request with the result.
#
# The mechanics live in camunda/sdk-infra so all five SDKs share one implementation;
# this file supplies only what is genuinely repo-specific: the toolchain to install
# and the commands that define "verified" here.

name: Agent — example coverage

on:
  issues:
    # `labeled` only: creating an issue with labels fires BOTH `opened` and
    # `labeled`, which ran the agent twice for every auto-filed issue.
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue-number:
        description: 'Coverage issue to work on (for re-runs).'
        required: true
        type: string

permissions: {}

jobs:
  implement:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'new-operations')
    permissions:
      contents: read           # checkout; the app token does the pushing
      id-token: write          # mint GitHub OIDC token for Vault JWT auth
      copilot-requests: write  # Copilot CLI auth via GITHUB_TOKEN (billed to the org)
      issues: write            # report the outcome back on the issue
    uses: camunda/sdk-infra/.github/workflows/sdk-agent-example-coverage.yml@v1
    # Explicit rather than `inherit`: the shared workflow needs only Vault auth,
    # and this job hands the repo to an LLM agent.
    secrets:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_JWT_PATH: ${{ secrets.VAULT_JWT_PATH }}
      VAULT_JWT_ROLE: ${{ secrets.VAULT_JWT_ROLE }}
      VAULT_JWT_AUDIENCE: ${{ secrets.VAULT_JWT_AUDIENCE }}
    with:
      language: python
      issue-number: ${{ github.event.issue.number || inputs.issue-number }}
      # `make bundle-spec` first: the coverage check reads the spec bundle committed
      # in this repo, so without a refresh it reports 100% for operations that only
      # exist upstream — which is how a run once closed a real gap as already covered.
      verify-commands: |
        make bundle-spec
        uv run python scripts/check_example_coverage.py
        uv run python scripts/check_method_example_completeness.py
        make lint
        make typecheck
        make sync-readme-check
        make test
      # `uv run` resolves the environment and may re-pin the lockfile; the bundle is
      # rewritten by the refresh above.
      verify-artifacts: |
        uv.lock
        external-spec/bundled/**
      extra-instructions: |
        The committed spec bundle under external-spec/ is a snapshot, not the live
        upstream spec. Run `make bundle-spec` before you trust any coverage result,
        and `make generate` if the refreshed spec exposes operations the SDK does not
        have yet — committing the regenerated output separately, as AGENTS.md requires.
