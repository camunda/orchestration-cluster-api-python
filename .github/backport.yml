# Backport configuration for camunda/sdk-infra's sdk-backport.yml
# (schema: https://github.com/camunda/sdk-infra/blob/main/schema/backport.schema.json).
# Read from the TARGET branch: keep a copy on main and on every live stable/N.
language: python

# Derived from the upstream spec or the generator. Restored from the target branch
# and regenerated there.
generated-paths:
  - external-spec
  - generated

# Regenerates from the committed spec (no bundle-spec refetch). UV_FROZEN keeps uv
# from rewriting uv.lock, which isn't a generated path. The unit tests catch a
# backport that breaks against this branch's generated code.
regenerate: export UV_FROZEN=1 && uv sync && make generate-only && uv run pytest -q tests/unit
